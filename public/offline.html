<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barbets</title>
    <!--
      Served natively via capacitor.config.ts's server.errorPath, not by Next.js — this is a
      bundled native asset (from webDir), loaded with zero network by Android's
      BridgeWebViewClient / iOS's didFailProvisionalNavigation on a failed main-frame load. No
      React, no Tailwind build, no next/font: everything here has to be able to render with
      nothing but what's already on the device. Keep this in sync with app/offline/page.tsx's
      copy (the browser/PWA equivalent), but it can't share code with it.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #faf6ef;
        color: #705441;
        font-family:
          ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 40px 20px calc(env(safe-area-inset-bottom) + 40px);
        padding-top: calc(env(safe-area-inset-top) + 40px);
      }
      img {
        height: 96px;
        width: auto;
        opacity: 0.5;
        filter: grayscale(1);
      }
      h1 {
        font-size: 30px;
        line-height: 34px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #2c1f17;
        margin: 28px 0 0;
      }
      p {
        max-width: 310px;
        font-size: 16px;
        line-height: 24px;
        margin: 12px 0 0;
      }
      /* Outline, not the filled CTA every other screen uses: this is the one action the app
         can't promise will work. Matches OfflineRetryButton on the web page. */
      button {
        margin-top: 28px;
        width: 100%;
        max-width: 330px;
        padding: 16px 24px;
        border: 1px solid #cbb6a2;
        border-radius: 999px;
        background: transparent;
        color: #2c1f17;
        font-size: 17px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        background: #f2eae1;
      }
    </style>
  </head>
  <body>
    <img src="/barbets-coin.png" alt="" />
    <h1>You're offline.</h1>
    <p>
      Odds and balances move too fast to show you a guess. Reconnect and we'll pick up where you left off.
    </p>
    <button id="retry">Try again</button>
    <script>
      var APP_URL = 'https://barbets.vercel.app';
      function retry() {
        window.location.href = APP_URL;
      }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
