<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Barbets</title>
    <!--
      Served natively via capacitor.config.ts's server.errorPath, not by Next.js — this is a
      bundled native asset (from webDir), loaded with zero network by Android's
      BridgeWebViewClient / iOS's didFailProvisionalNavigation on a failed main-frame load. No
      React, no Tailwind build, no next/font: everything here has to be able to render with
      nothing but what's already on the device. Keep this in sync with app/offline/page.tsx's
      copy (the browser/PWA equivalent), but it can't share code with it.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #f6f7f9;
        color: #5a6373;
        font-family:
          ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 40px 20px calc(env(safe-area-inset-bottom) + 40px);
        padding-top: calc(env(safe-area-inset-top) + 40px);
      }
      /* The 3ac "b" tile drawn as type, same as BrandTile size={64} on app/offline/page.tsx, so
         there's no image to bundle. Greyed out, like the web page's opacity-50 grayscale. */
      .tile {
        width: 64px;
        height: 64px;
        border-radius: 15px;
        background: #2d55f5;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 37px;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        opacity: 0.5;
        filter: grayscale(1);
      }
      .tile span {
        margin-top: -3px;
      }
      h1 {
        font-size: 30px;
        line-height: 34px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0c1018;
        margin: 28px 0 0;
      }
      p {
        max-width: 310px;
        font-size: 16px;
        line-height: 24px;
        margin: 12px 0 0;
      }
      /* Outline, not the filled CTA every other screen uses: this is the one action the app
         can't promise will work. Matches OfflineRetryButton on the web page. */
      button {
        margin-top: 28px;
        width: 100%;
        max-width: 330px;
        padding: 16px 24px;
        border: 1px solid #cfd6e2;
        border-radius: 14px;
        background: transparent;
        color: #0c1018;
        font-size: 17px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        background: #eef0f4;
      }
    </style>
  </head>
  <body>
    <div class="tile" aria-hidden="true"><span>b</span></div>
    <h1 id="headline">You're offline.</h1>
    <p id="body">
      Odds and balances move too fast to show you a guess. Reconnect and we'll pick up where you left off.
    </p>
    <button id="retry">Try again</button>
    <script>
      // Must match server.url in capacitor.config.ts. This file is bundled into the native app
      // rather than served, so it cannot import lib/appOrigin.ts and cannot be fixed by a deploy.
      var APP_URL = 'https://app.mybarbets.com';
      function retry() {
        window.location.href = APP_URL;
      }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);

      // This page also loads when the device has a real connection but the request still failed
      // (the server itself down or unreachable, not the device) - see app/offline/page.tsx's
      // OfflineHeadline for the same split, and the ARCHITECTURE.md note on why "you're offline"
      // reads as wrong and unhelpful in that case.
      if (navigator.onLine) {
        document.getElementById('headline').textContent = "We're having trouble.";
        document.getElementById('body').textContent = 'Your connection looks fine, so this is on us. Hang tight and try again in a minute.';
      }
    </script>
  </body>
</html>
